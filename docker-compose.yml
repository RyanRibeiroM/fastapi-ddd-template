services:
  api:
    build: .
    container_name: fastapi-ddd-template
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=dev
      - APP_DEBUG=True
      - DATABASE_URL=postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-minhasenha}@postgres:5432/template_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/src/src
      - ./tests:/src/tests
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:15-alpine
    container_name: template_postgress
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-minhasenha}
      - POSTGRES_DB=template_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
